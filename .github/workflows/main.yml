name: Build MT798x OpenWrt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Config
        uses: actions/checkout@v5

      # ====================
      # 修复 1：装全依赖
      # ====================
      - name: Install Build Depends
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext libncurses5-dev python3-distutils python3-setuptools texinfo unzip zlib1g-dev libssl-dev libelf-dev autoconf automake libtool autopoint device-tree-compiler ccache swig

      - name: Clone Source Code
        run: |
          git clone -b mt798x-mt799x-6.6-mtwifi --single-branch https://github.com/ilove125006436/ziyong.git openwrt
          cp .config openwrt/.config

      - name: Feed Update & Install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig Adapt
        run: |
          cd openwrt
          make defconfig

      - name: Pre-download All Source
        run: |
          cd openwrt
          make download -j$(nproc)

      # ====================
      # 修复 2：使用 -j1 单线程编译，避免 Actions 崩溃
      # ====================
      - name: Compile Firmware
        run: |
          cd openwrt
          make V=s -j1

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: MT798x-Firmware
          path: openwrt/bin/targets/
